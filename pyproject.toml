[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goome"
version = "0.5.1"
description = "goome for Python. See-through overlays, normal app windows, game mod menus and engine ui. One file, no dependencies, Linux, Windows, Mac."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "sevvy-wevvy" }]
keywords = ["overlay", "hotkeys", "screen capture", "immediate mode ui", "gui", "click-through"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Desktop Environment",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]
dynamic = ["license"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/goome-ui/python-goome"
Documentation = "https://goome-ui.github.io/docs/"
Issues = "https://github.com/goome-ui/python-goome/issues"
Changelog = "https://github.com/goome-ui/python-goome/releases"
"C library" = "https://github.com/goome-ui/c-goome"

[tool.setuptools]
packages = ["goome"]
include-package-data = false

[tool.setuptools.package-data]
goome = ["_native/*.so", "_native/*.dylib", "_native/*.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
