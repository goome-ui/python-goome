[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goome"
version = "0.1.0"
description = "See-through, always on top overlays for Python, on top of the goome C library"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "sevvy-wevvy" }]
keywords = ["overlay", "hotkeys", "screen capture", "immediate mode ui"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]
dynamic = ["license"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/goome-ui/python-goome"
"C library" = "https://github.com/goome-ui/c-goome"

[tool.setuptools]
packages = ["goome"]
include-package-data = false

[tool.setuptools.package-data]
goome = ["_native/*.so", "_native/*.dylib", "_native/*.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
